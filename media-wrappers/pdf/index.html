<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF Document Wrapper - xAPI / TinCan.js</title>
    <style>
        :root {
            --primary: #1a73e8;
            --success: #34a853;
            --bg: #202124;
            --card-bg: #2d2f31;
            --border: #444746;
            --text: #ffffff;
            --text-dim: #c4c7c5;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .reader-card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 20px;
            max-width: 900px;
            width: 100%;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
            border: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .header-section {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
            padding-bottom: 12px;
        }

        .header-section h2 {
            font-size: 1.15rem;
            margin: 0;
            color: #8ab4f8;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .status-banner {
            background: #3c4043;
            color: var(--text-dim);
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: 500;
        }

        .status-banner.active {
            background: #133e68;
            color: #8ab4f8;
        }

        .status-banner.completed {
            background: #144927;
            color: #81c995;
        }

        /* PDF Viewer Container */
        .pdf-frame-container {
            width: 100%;
            height: 520px;
            background: #000;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid var(--border);
            position: relative;
        }

        .pdf-frame {
            width: 100%;
            height: 100%;
            border: none;
            background: #525659;
        }

        /* Reading Progress & Attestation Bar */
        .attestation-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #1e1f20;
            padding: 14px 20px;
            border-radius: 8px;
            border: 1px solid var(--border);
            flex-wrap: wrap;
            gap: 12px;
        }

        .reading-timer {
            font-size: 0.85rem;
            color: var(--text-dim);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .timer-badge {
            background: #3c4043;
            padding: 3px 8px;
            border-radius: 4px;
            font-family: monospace;
            font-weight: bold;
            color: #8ab4f8;
        }

        .btn-complete {
            background: var(--success);
            color: #ffffff;
            border: none;
            padding: 10px 24px;
            border-radius: 6px;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-complete:hover:not(:disabled) {
            background: #2d8e47;
            box-shadow: 0 2px 6px rgba(52, 168, 83, 0.4);
        }

        .btn-complete:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
    </style>
</head>
<body>
    <div class="reader-card">
        <div class="header-section">
            <h2 id="pdfTitle">📄 Document Viewer: Standard Operating Procedure</h2>
            <div id="statusBanner" class="status-banner">Initializing TinCan.js...</div>
        </div>

        <!-- High-Fidelity PDF Embed Container -->
        <div class="pdf-frame-container">
            <iframe id="pdfFrame" class="pdf-frame" src="sample.pdf" type="application/pdf"></iframe>
        </div>

        <!-- Telemetry & Attestation Footer -->
        <div class="attestation-bar">
            <div class="reading-timer">
                <span>⏱️ Dwell Time:</span>
                <span class="timer-badge" id="timerBadge">00:00</span>
                <span id="readStatusText" style="font-size: 0.8rem; color: #9aa0a6;">(Reading progress tracked via xAPI)</span>
            </div>

            <div>
                <button id="completePdfBtn" class="btn-complete">
                    ✓ Acknowledge & Complete Document
                </button>
            </div>
        </div>
    </div>

    <!-- Load xAPI Library & Tracker -->
    <script src="../lib/tincan-min.js"></script>
    <script src="pdf-tracker.js"></script>
</body>
</html>
