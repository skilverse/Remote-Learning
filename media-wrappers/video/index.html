<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Media Wrapper - xAPI / TinCan.js</title>
    <style>
        :root {
            --primary: #1a73e8;
            --success: #34a853;
            --bg: #1e1e1e;
            --card-bg: #2d2d2d;
            --text: #ffffff;
            --text-dim: #aaaaaa;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .video-card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 20px;
            max-width: 780px;
            width: 100%;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
        }

        .header-section {
            margin-bottom: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-section h2 {
            font-size: 1.2rem;
            margin: 0;
        }

        .status-banner {
            background: #444;
            color: #ddd;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: 500;
        }

        .status-banner.active {
            background: #133e68;
            color: #8ab4f8;
        }

        .status-banner.completed {
            background: #144927;
            color: #81c995;
        }

        .video-container {
            position: relative;
            background: #000;
            border-radius: 8px;
            overflow: hidden;
            width: 100%;
            height: 380px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        /* Milestone Trackers */
        .milestones-bar {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            margin-top: 16px;
        }

        .milestone-pill {
            flex: 1;
            text-align: center;
            padding: 8px;
            background: #3a3a3a;
            color: var(--text-dim);
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: 600;
            transition: all 0.3s;
        }

        .milestone-pill.reached {
            background: var(--success);
            color: #fff;
            transform: scale(1.02);
        }

        /* QA & Simulator Controls */
        .controls-section {
            margin-top: 20px;
            padding-top: 16px;
            border-top: 1px solid #444;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        .test-btns {
            display: flex;
            gap: 8px;
        }

        .btn-test {
            background: #3c4043;
            color: #e8eaed;
            border: 1px solid #5f6368;
            padding: 6px 12px;
            border-radius: 4px;
            font-size: 0.75rem;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-test:hover {
            background: #5f6368;
        }
    </style>
</head>
<body>
    <div class="video-card">
        <div class="header-section">
            <h2>🎥 Compliance Video Player</h2>
            <div id="statusBanner" class="status-banner">Initializing TinCan.js...</div>
        </div>

        <div class="video-container">
            <!-- Sample instructional video with subtitles -->
            <video id="mediaVideo" controls preload="metadata">
                <source src="https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4" type="video/mp4">
                Your browser does not support HTML5 video.
            </video>
        </div>

        <div class="milestones-bar">
            <div id="milestone25" class="milestone-pill">25% Progressed</div>
            <div id="milestone50" class="milestone-pill">50% Progressed</div>
            <div id="milestone75" class="milestone-pill">75% Progressed</div>
            <div id="milestone100" class="milestone-pill">100% Completed</div>
        </div>

        <div class="controls-section">
            <span style="font-size: 0.8rem; color: #9aa0a6;">Simulate Playhead:</span>
            <div class="test-btns">
                <button class="btn-test" onclick="window.testSeek(4)">Seek to 25%</button>
                <button class="btn-test" onclick="window.testSeek(8)">Seek to 50%</button>
                <button class="btn-test" onclick="window.testSeek(12)">Seek to 75%</button>
                <button class="btn-test" onclick="window.testSeek(15)">Complete (100%)</button>
            </div>
        </div>
    </div>

    <!-- Load xAPI Library & Tracker -->
    <script src="../lib/tincan-min.js"></script>
    <script src="video-tracker.js"></script>
</body>
</html>
