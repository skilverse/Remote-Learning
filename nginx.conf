server {
    listen 80;
    server_name localhost lrs.lxdhq.in _;
    root /usr/share/nginx/html;

    # Redirect root to /portal/index.html
    location = / {
        return 302 /portal/index.html;
    }

    # Reverse proxy for Learning Nexus REST API
    location /api/ {
        proxy_pass http://mock-nexus:4000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Reverse proxy for Trax LRS xAPI statements endpoint
    location /xapi/ {
        proxy_pass http://mock-lrs:8000/xapi/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Static assets fallback with CORS
    location / {
        add_header Access-Control-Allow-Origin *;
        add_header Access-Control-Allow-Methods 'GET, POST, OPTIONS';
        add_header Access-Control-Allow-Headers 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization,X-Experience-API-Version';
        try_files $uri $uri/ =404;
    }
}
